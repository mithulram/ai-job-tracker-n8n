name = "ai-job-tracker-live-search"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Create this KV namespace yourself (see SETUP.md) and paste its id here,
# or run `wrangler kv namespace create RATE_LIMIT_KV` and it will print one.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Not secret - OAuth Client IDs are meant to be public. Kept as a var so it's
# only defined in one place. Set the real value with:
#   wrangler secret put GOOGLE_CLIENT_ID   (or just edit this var and redeploy)
GOOGLE_CLIENT_ID = "REPLACE_WITH_YOUR_GOOGLE_OAUTH_CLIENT_ID"
# The GitHub Pages origin allowed to call this Worker.
ALLOWED_ORIGIN = "https://mithulram.github.io"

# GROQ_API_KEY is a real secret - do NOT put it here. Set it with:
#   wrangler secret put GROQ_API_KEY
